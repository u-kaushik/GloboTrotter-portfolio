<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- White background -->
  <rect width="1200" height="630" fill="#ffffff"/>

  <!-- Green top bar -->
  <rect width="1200" height="6" fill="#22c55e"/>

  <!-- Favicon icon — exact from public/favicon.svg, scaled to 88×88, centred -->
  <g transform="translate(556, 108) scale(1.375)">
    <rect width="64" height="64" rx="16" fill="#22c55e"/>
    <g transform="translate(12,12) scale(1.6667)" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
      <path d="M2 12h20"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text
    x="600" y="278"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="900"
    font-size="88"
    letter-spacing="-2"
  ><tspan fill="#1f2937">Globo</tspan><tspan fill="#22c55e">Trotter</tspan></text>

  <!-- Headline -->
  <text
    x="600" y="336"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="26"
    fill="#6b7280"
  >Map every adventure. Plan your next one with AI.</text>

  <!-- CTA pill -->
  <rect x="462" y="368" width="276" height="52" rx="26" fill="#22c55e"/>
  <text
    x="600" y="400"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="700"
    font-size="20"
    fill="#ffffff"
  >Start free — no card needed</text>

  <!-- Domain -->
  <text
    x="600" y="462"
    text-anchor="middle"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-weight="600"
    font-size="18"
    fill="#9ca3af"
  >globotrottr.com</text>
</svg>
